<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회원가입 | 대한수자원</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app-header" data-active="signup"></div>

<main class="wrap wrap-narrow">
  <div class="page-title"><h1>회원가입</h1></div>
  <form id="signup-form" class="card" autocomplete="on" novalidate>
    <div id="msg" class="alert alert-error hidden"></div>
    <div class="field">
      <label for="display_name">사용자명</label>
      <input type="text" id="display_name" name="display_name" autocomplete="name" required maxlength="30" placeholder="화면에 표시될 이름 (예: 박준호)">
    </div>
    <div class="field">
      <label for="username">아이디</label>
      <input type="text" id="username" name="username" autocomplete="username" required
             pattern="[a-z0-9_]{3,20}" placeholder="영문 소문자·숫자·밑줄 3~20자">
      <div class="hint">로그인할 때 쓰는 아이디입니다. 가입 후 변경할 수 없습니다.</div>
    </div>
    <div class="field">
      <label for="password">비밀번호</label>
      <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8" placeholder="8자 이상">
    </div>
    <div class="field">
      <label for="password2">비밀번호 확인</label>
      <input type="password" id="password2" name="password2" autocomplete="new-password" required>
    </div>
    <button type="submit" id="btn-signup" class="btn btn-block">가입하기</button>
    <p class="muted" style="text-align:center;margin:14px 0 0">
      이미 계정이 있으신가요? <a href="./login.html">로그인</a>
    </p>
    <p class="muted" style="margin:12px 0 0">
      가입만으로는 글을 쓸 수 없습니다. 공지·갤러리 작성 권한(관리자)은 기존 관리자가 부여합니다.
    </p>
  </form>
</main>

<script type="module">
  import { signUp, humanError, getSession, USERNAME_RE } from './supabase.js';
  import { renderHeader, toast, setBusy } from './ui.js';

  await renderHeader('signup');
  if (await getSession()) location.replace('./notices.html');

  const form = document.getElementById('signup-form');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btn-signup');
  const showErr = (t) => { msg.textContent = t; msg.classList.remove('hidden'); };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.classList.add('hidden');
    const displayName = form.display_name.value.trim();
    const username = form.username.value.trim().toLowerCase();
    const password = form.password.value;
    const password2 = form.password2.value;

    if (!displayName) return showErr('사용자명을 입력하세요.');
    if (!USERNAME_RE.test(username)) return showErr('아이디는 영문 소문자·숫자·밑줄(_) 3~20자로 입력하세요.');
    if (password.length < 8) return showErr('비밀번호는 8자 이상이어야 합니다.');
    if (password !== password2) return showErr('비밀번호가 서로 다릅니다.');

    setBusy(btn, true, '가입 중…');
    try {
      const { session } = await signUp({ username, displayName, password });
      if (!session) {
        // Supabase Auth 의 'Confirm email' 이 켜져 있으면 세션이 안 생김 (가짜 이메일이라 확인 메일 수신 불가)
        showErr('가입은 되었지만 이메일 확인 설정이 켜져 있어 로그인할 수 없습니다. Supabase → Authentication → Providers → Email → "Confirm email" 을 끄고 다시 시도하세요.');
        return;
      }
      toast('가입이 완료되었습니다.', 'success');
      location.href = './notices.html';
    } catch (err) {
      showErr(humanError(err));
    } finally {
      setBusy(btn, false, '');
    }
  });
</script>
</body>
</html>
