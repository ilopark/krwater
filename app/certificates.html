<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인증서 | 대한수자원</title>
<link rel="stylesheet" href="./style.css">
<style>
  .pdf-frame { width: 100%; height: 75vh; min-height: 480px; border: 1px solid var(--line); border-radius: 8px; background: #525659; }
  .cert-img { display: block; margin: 0 auto; max-height: 85vh; border: 1px solid var(--line); border-radius: 8px; }
  .gcard .thumb.pdf { background: #f3f4f6; flex-direction: column; gap: 6px; color: var(--primary); font-weight: 600; }
  .gcard .thumb.pdf small { color: var(--muted); font-weight: 400; }
</style>
</head>
<body>
<div id="app-header" data-active="certificates"></div>

<main class="wrap">
  <!-- 목록 -->
  <section id="view-list">
    <div class="page-title">
      <h1>인증서</h1>
      <button id="btn-new" class="btn hidden">+ 인증서 등록</button>
    </div>
    <div id="grid" class="grid"><div class="empty">불러오는 중…</div></div>
  </section>

  <!-- 상세 -->
  <section id="view-detail" class="hidden">
    <div class="card">
      <div class="post-head">
        <h2 id="d-title"></h2>
        <div class="post-meta"><span id="d-file"></span><span id="d-date"></span></div>
      </div>
      <div id="d-desc" class="post-body" style="min-height:auto;margin-bottom:14px"></div>
      <div id="d-preview"></div>
      <p class="muted" id="d-links" style="margin-top:10px"></p>
      <div class="post-foot">
        <a href="./certificates.html" class="btn btn-ghost">목록</a>
        <div class="btn-row hidden" id="d-admin">
          <button id="btn-edit" class="btn btn-ghost">수정</button>
          <button id="btn-delete" class="btn btn-danger">삭제</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 등록/수정 폼 (관리자) -->
  <section id="view-form" class="hidden">
    <div class="page-title"><h1 id="form-title">인증서 등록</h1></div>
    <form id="post-form" class="card" novalidate>
      <div id="form-msg" class="alert alert-error hidden"></div>
      <div class="field">
        <label for="f-title">제목</label>
        <input type="text" id="f-title" name="title" required maxlength="200" placeholder="예: 특허증 제10-2389872호">
      </div>
      <div class="field">
        <label for="f-desc">설명</label>
        <textarea id="f-desc" name="description" style="min-height:100px" placeholder="발급기관, 발급일 등 (선택)"></textarea>
      </div>
      <div class="field">
        <label for="f-order">정렬 순서</label>
        <input type="text" id="f-order" name="sort_order" inputmode="numeric" pattern="[0-9]*" value="0" style="max-width:120px">
        <div class="hint">숫자가 작을수록 앞에 표시됩니다.</div>
      </div>
      <div class="field">
        <label for="f-file">파일 (PDF 또는 이미지)</label>
        <input type="file" id="f-file" name="file" accept="application/pdf,image/*">
        <div class="hint" id="file-hint">PDF 또는 JPG/PNG. 파일당 20MB 이하. 이미지는 업로드 전에 자동 축소됩니다(긴 변 2000px).</div>
      </div>
      <div id="progress-wrap" class="hidden">
        <div class="muted" id="progress-text"></div>
        <div class="progress"><i id="progress-bar"></i></div>
      </div>
      <div class="form-actions">
        <button type="button" id="btn-cancel" class="btn btn-ghost">취소</button>
        <button type="submit" id="btn-save" class="btn">저장</button>
      </div>
    </form>
  </section>
</main>

<script type="module">
  import { sb, humanError } from './supabase.js';
  import { IMAGE_QUALITY } from './config.js';
  import { renderHeader, esc, nl2br, fmtDate, fmtBytes, qs, toast, setBusy } from './ui.js';

  const BUCKET = 'certificates';
  const MAX_MB = 20;
  const MAX_EDGE = 2000;   // 인증서는 글씨가 읽혀야 하므로 갤러리보다 크게
  const $ = (id) => document.getElementById(id);
  const views = { list: $('view-list'), detail: $('view-detail'), form: $('view-form') };
  const show = (name) => Object.entries(views).forEach(([k, el]) => el.classList.toggle('hidden', k !== name));
  const storage = sb.storage.from(BUCKET);
  const publicUrl = (path) => storage.getPublicUrl(path).data.publicUrl;

  const id = qs('id');
  const mode = qs('mode');
  const profile = await renderHeader('certificates');
  const isAdmin = profile?.role === 'admin';
  let current = null;

  // ---------- 목록 ----------
  async function loadList() {
    $('btn-new').classList.toggle('hidden', !isAdmin);
    const { data, error } = await sb.from('certificates')
      .select('id, title, file_type, url, file_name, sort_order, created_at')
      .order('sort_order', { ascending: true })
      .order('created_at', { ascending: false });
    const grid = $('grid');
    if (error) { grid.innerHTML = `<div class="empty">${esc(humanError(error))}</div>`; return; }
    if (!data.length) { grid.innerHTML = `<div class="empty">등록된 인증서가 없습니다.</div>`; return; }
    grid.innerHTML = data.map(c => `
      <a class="gcard" href="./certificates.html?id=${c.id}">
        ${c.file_type === 'image'
          ? `<div class="thumb" style="background-image:url('${esc(c.url)}');background-size:contain;background-color:#f3f4f6"></div>`
          : `<div class="thumb pdf">📄 PDF<small>${esc(c.file_name || '')}</small></div>`}
        <div class="info"><b>${esc(c.title)}</b><span>${fmtDate(c.created_at)}</span></div>
      </a>`).join('');
  }

  // ---------- 상세 ----------
  async function loadDetail(certId) {
    const { data, error } = await sb.from('certificates').select('*').eq('id', certId).maybeSingle();
    if (error || !data) { toast(error ? humanError(error) : '인증서를 찾을 수 없습니다.', 'error'); location.replace('./certificates.html'); return; }
    current = data;
    $('d-title').textContent = data.title;
    $('d-file').textContent = `${data.file_type === 'pdf' ? 'PDF' : '이미지'} · ${data.file_name || ''}${data.file_size ? ` (${fmtBytes(data.file_size)})` : ''}`;
    $('d-date').textContent = fmtDate(data.created_at, true);
    $('d-desc').innerHTML = nl2br(data.description);
    $('d-preview').innerHTML = data.file_type === 'pdf'
      ? `<iframe class="pdf-frame" src="${esc(data.url)}#toolbar=1&view=FitH" title="${esc(data.title)}"></iframe>`
      : `<img class="cert-img" src="${esc(data.url)}" alt="${esc(data.title)}">`;
    $('d-links').innerHTML = `<a href="${esc(data.url)}" target="_blank" rel="noopener">새 창에서 열기</a> · <a href="${esc(data.url)}" download="${esc(data.file_name || '')}">다운로드</a>` +
      (data.file_type === 'pdf' ? ' <span class="muted">(휴대폰에서 미리보기가 안 보이면 "새 창에서 열기")</span>' : '');
    $('d-admin').classList.toggle('hidden', !isAdmin);
    document.title = `${data.title} | 대한수자원`;
    show('detail');
  }

  $('btn-edit').addEventListener('click', () => openForm(current));
  $('btn-delete').addEventListener('click', async () => {
    if (!current || !confirm(`"${current.title}" 인증서를 삭제할까요?`)) return;
    try {
      const { error: sErr } = await storage.remove([current.storage_path]); if (sErr) throw sErr;
      const { error } = await sb.from('certificates').delete().eq('id', current.id); if (error) throw error;
      toast('삭제되었습니다.', 'success');
      location.href = './certificates.html';
    } catch (err) { toast(humanError(err), 'error'); }
  });

  // ---------- 등록/수정 ----------
  function openForm(cert) {
    if (!isAdmin) return toast('관리자만 등록할 수 있습니다.', 'error');
    const f = $('post-form');
    $('form-title').textContent = cert ? '인증서 수정' : '인증서 등록';
    f.title.value = cert?.title || '';
    f.description.value = cert?.description || '';
    f.sort_order.value = cert?.sort_order ?? 0;
    f.file.value = '';
    f.dataset.editId = cert?.id || '';
    $('file-hint').textContent = cert
      ? `현재 파일: ${cert.file_name || ''} — 바꾸려면 새 파일을 선택하세요 (비우면 기존 파일 유지).`
      : 'PDF 또는 JPG/PNG. 파일당 20MB 이하. 이미지는 업로드 전에 자동 축소됩니다(긴 변 2000px).';
    $('form-msg').classList.add('hidden');
    $('progress-wrap').classList.add('hidden');
    show('form');
    f.title.focus();
  }
  $('btn-new').addEventListener('click', () => openForm(null));
  $('btn-cancel').addEventListener('click', () => history.length > 1 ? history.back() : location.href = './certificates.html');

  async function shrinkImage(file) {
    if (!file.type.startsWith('image/') || /gif|svg/.test(file.type)) return file;
    let bmp;
    try { bmp = await createImageBitmap(file); } catch { return file; }
    const scale = Math.min(1, MAX_EDGE / Math.max(bmp.width, bmp.height));
    if (scale === 1 && file.size < 2 * 1024 * 1024) return file;
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', IMAGE_QUALITY));
    return new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' });
  }
  const safeName = (name) => name.normalize('NFKD').replace(/[^\w.-]+/g, '_').replace(/^_+|_+$/g, '').slice(-80) || 'file';

  $('post-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target, msg = $('form-msg'), btn = $('btn-save');
    const showErr = (t) => { msg.textContent = t; msg.classList.remove('hidden'); };
    const title = f.title.value.trim();
    const description = f.description.value;
    const sort_order = parseInt(f.sort_order.value || '0', 10) || 0;
    const raw = f.file.files[0] || null;
    const editId = f.dataset.editId;
    if (!title) return showErr('제목을 입력하세요.');
    if (!editId && !raw) return showErr('PDF 또는 이미지 파일을 선택하세요.');
    if (raw && !(raw.type === 'application/pdf' || raw.type.startsWith('image/'))) return showErr('PDF 또는 이미지 파일만 올릴 수 있습니다.');
    if (raw && raw.size > MAX_MB * 1024 * 1024) return showErr(`파일이 ${MAX_MB}MB 를 넘습니다.`);

    setBusy(btn, true, '저장 중…');
    try {
      const payload = { title, description, sort_order };
      if (raw) {
        $('progress-wrap').classList.remove('hidden'); $('progress-text').textContent = `업로드 중… ${raw.name}`; $('progress-bar').style.width = '30%';
        const file = raw.type === 'application/pdf' ? raw : await shrinkImage(raw);
        const path = `${Date.now()}_${safeName(file.name)}`;
        const { error: upErr } = await storage.upload(path, file, { contentType: file.type, upsert: false });
        if (upErr) throw upErr;
        $('progress-bar').style.width = '80%';
        Object.assign(payload, {
          file_type: raw.type === 'application/pdf' ? 'pdf' : 'image',
          storage_path: path, url: publicUrl(path), file_name: raw.name, file_size: file.size,
        });
      }
      let savedId = editId;
      if (editId) {
        const { error } = await sb.from('certificates').update(payload).eq('id', editId);
        if (error) throw error;
        if (raw && current?.storage_path) await storage.remove([current.storage_path]);   // 기존 파일 정리
      } else {
        payload.author_id = profile.id; payload.author_name = profile.display_name;
        const { data, error } = await sb.from('certificates').insert(payload).select('id').single();
        if (error) throw error;
        savedId = data.id;
      }
      $('progress-bar').style.width = '100%';
      toast('저장되었습니다.', 'success');
      location.href = `./certificates.html?id=${savedId}`;
    } catch (err) {
      showErr(humanError(err));
      setBusy(btn, false, '');
    }
  });

  // ---------- 라우팅 ----------
  if (mode === 'new') { show('list'); openForm(null); }
  else if (id) { await loadDetail(id); }
  else { show('list'); await loadList(); }
</script>
</body>
</html>
