<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공지사항 | 대한수자원</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app-header" data-active="notices"></div>

<main class="wrap">
  <!-- 목록 -->
  <section id="view-list">
    <div class="page-title">
      <h1 id="list-title">공지사항</h1>
      <button id="btn-new" class="btn hidden">+ 새 글 작성</button>
    </div>
    <div class="tabs">
      <a href="./notices.html" data-cat="">전체</a>
      <a href="./notices.html?category=notice" data-cat="notice">공지사항</a>
      <a href="./notices.html?category=news" data-cat="news">뉴스</a>
    </div>
    <table class="tbl">
      <thead><tr><th class="num">번호</th><th>제목</th><th class="date">작성일</th><th class="views">조회</th></tr></thead>
      <tbody id="list-body"><tr><td colspan="4" class="empty">불러오는 중…</td></tr></tbody>
    </table>
    <div id="pager" class="pager"></div>
  </section>

  <!-- 상세 -->
  <section id="view-detail" class="hidden">
    <div class="card">
      <div class="post-head">
        <h2 id="d-title"></h2>
        <div class="post-meta">
          <span id="d-cat"></span><span id="d-author"></span><span id="d-date"></span><span id="d-views"></span>
        </div>
      </div>
      <div id="d-body" class="post-body"></div>
      <div class="post-foot">
        <a href="./notices.html" id="d-back" class="btn btn-ghost">목록</a>
        <div class="btn-row hidden" id="d-admin">
          <button id="btn-edit" class="btn btn-ghost">수정</button>
          <button id="btn-delete" class="btn btn-danger">삭제</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 작성/수정 폼 (관리자) -->
  <section id="view-form" class="hidden">
    <div class="page-title"><h1 id="form-title">새 글 작성</h1></div>
    <form id="post-form" class="card" novalidate>
      <div id="form-msg" class="alert alert-error hidden"></div>
      <div class="field">
        <label for="f-category">구분</label>
        <select id="f-category" name="category">
          <option value="notice">공지사항</option>
          <option value="news">뉴스</option>
        </select>
      </div>
      <div class="field">
        <label for="f-title">제목</label>
        <input type="text" id="f-title" name="title" required maxlength="200">
      </div>
      <div class="field">
        <label for="f-content">내용</label>
        <textarea id="f-content" name="content" placeholder="내용을 입력하세요. 줄바꿈은 그대로 표시됩니다."></textarea>
      </div>
      <div class="field">
        <label class="check"><input type="checkbox" id="f-pinned" name="is_pinned"> 상단 고정</label>
      </div>
      <div class="form-actions">
        <button type="button" id="btn-cancel" class="btn btn-ghost">취소</button>
        <button type="submit" id="btn-save" class="btn">저장</button>
      </div>
    </form>
  </section>
</main>

<script type="module">
  import { sb, getProfile, humanError } from './supabase.js';
  import { PAGE_SIZE } from './config.js';
  import { renderHeader, esc, nl2br, fmtDate, qs, toast, setBusy } from './ui.js';

  const CAT_LABEL = { notice: '공지사항', news: '뉴스' };
  const $ = (id) => document.getElementById(id);
  const views = { list: $('view-list'), detail: $('view-detail'), form: $('view-form') };
  const show = (name) => Object.entries(views).forEach(([k, el]) => el.classList.toggle('hidden', k !== name));

  const category = qs('category') || '';
  const page = Math.max(1, parseInt(qs('page') || '1', 10));
  const id = qs('id');
  const mode = qs('mode');   // 'new' | 'edit'

  const profile = await renderHeader(category === 'news' ? 'news' : 'notices');
  const isAdmin = profile?.role === 'admin';
  let current = null;   // 상세에서 보고 있는 글

  // ---------- 목록 ----------
  async function loadList() {
    $('list-title').textContent = category ? CAT_LABEL[category] : '공지사항 · 뉴스';
    document.querySelectorAll('.tabs a').forEach(a => a.classList.toggle('on', a.dataset.cat === category));
    $('btn-new').classList.toggle('hidden', !isAdmin);

    const from = (page - 1) * PAGE_SIZE, to = from + PAGE_SIZE - 1;
    let q = sb.from('notices')
      .select('id, category, title, is_pinned, view_count, created_at', { count: 'exact' })
      .order('is_pinned', { ascending: false })
      .order('created_at', { ascending: false })
      .range(from, to);
    if (category) q = q.eq('category', category);
    const { data, count, error } = await q;
    const body = $('list-body');
    if (error) { body.innerHTML = `<tr><td colspan="4" class="empty">${esc(humanError(error))}</td></tr>`; return; }
    if (!data.length) { body.innerHTML = `<tr><td colspan="4" class="empty">등록된 글이 없습니다.</td></tr>`; $('pager').innerHTML = ''; return; }

    body.innerHTML = data.map((n, i) => `
      <tr>
        <td class="num">${n.is_pinned ? '<span class="pin">고정</span>' : count - from - i}</td>
        <td>${!category ? `<span class="cat">${CAT_LABEL[n.category] || n.category}</span>` : ''}
            <a class="title" href="./notices.html?id=${n.id}">${esc(n.title)}</a></td>
        <td class="date">${fmtDate(n.created_at)}</td>
        <td class="views">${n.view_count}</td>
      </tr>`).join('');

    const pages = Math.ceil(count / PAGE_SIZE);
    const link = (p, label = p) => p === page
      ? `<span class="on">${label}</span>`
      : `<a href="./notices.html?${category ? `category=${category}&` : ''}page=${p}">${label}</a>`;
    let html = '';
    if (pages > 1) {
      if (page > 1) html += link(page - 1, '‹');
      for (let p = Math.max(1, page - 3); p <= Math.min(pages, page + 3); p++) html += link(p);
      if (page < pages) html += link(page + 1, '›');
    }
    $('pager').innerHTML = html;
  }

  // ---------- 상세 ----------
  async function loadDetail(postId) {
    const { data, error } = await sb.from('notices').select('*').eq('id', postId).maybeSingle();
    if (error || !data) { toast(error ? humanError(error) : '글을 찾을 수 없습니다.', 'error'); location.replace('./notices.html'); return; }
    current = data;
    $('d-title').textContent = data.title;
    $('d-cat').innerHTML = `<span class="cat">${CAT_LABEL[data.category] || data.category}</span>`;
    $('d-author').textContent = data.author_name ? `작성자 ${data.author_name}` : '';
    $('d-date').textContent = fmtDate(data.created_at, true);
    $('d-views').textContent = `조회 ${data.view_count + 1}`;
    $('d-body').innerHTML = nl2br(data.content);
    $('d-back').href = `./notices.html${data.category ? `?category=${data.category}` : ''}`;
    $('d-admin').classList.toggle('hidden', !isAdmin);
    document.title = `${data.title} | 대한수자원`;
    show('detail');
    sb.rpc('increment_notice_view', { p_id: data.id }).then(() => {});   // 조회수 (실패해도 무시)
  }

  $('btn-edit').addEventListener('click', () => openForm(current));
  $('btn-delete').addEventListener('click', async () => {
    if (!current || !confirm(`"${current.title}" 글을 삭제할까요?`)) return;
    const { error } = await sb.from('notices').delete().eq('id', current.id);
    if (error) return toast(humanError(error), 'error');
    toast('삭제되었습니다.', 'success');
    location.href = `./notices.html?category=${current.category}`;
  });

  // ---------- 작성/수정 ----------
  function openForm(post) {
    if (!isAdmin) return toast('관리자만 작성할 수 있습니다.', 'error');
    const f = $('post-form');
    $('form-title').textContent = post ? '글 수정' : '새 글 작성';
    f.category.value = post?.category || (category || 'notice');
    f.title.value = post?.title || '';
    f.content.value = post?.content || '';
    f.is_pinned.checked = !!post?.is_pinned;
    f.dataset.editId = post?.id || '';
    $('form-msg').classList.add('hidden');
    show('form');
    f.title.focus();
  }

  $('btn-new').addEventListener('click', () => openForm(null));
  $('btn-cancel').addEventListener('click', () => history.length > 1 ? history.back() : location.href = './notices.html');

  $('post-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target, msg = $('form-msg'), btn = $('btn-save');
    const payload = {
      category: f.category.value,
      title: f.title.value.trim(),
      content: f.content.value,
      is_pinned: f.is_pinned.checked,
    };
    if (!payload.title) { msg.textContent = '제목을 입력하세요.'; msg.classList.remove('hidden'); return; }
    setBusy(btn, true, '저장 중…');
    try {
      const editId = f.dataset.editId;
      let saved;
      if (editId) {
        const { data, error } = await sb.from('notices').update(payload).eq('id', editId).select().single();
        if (error) throw error; saved = data;
      } else {
        payload.author_id = profile.id;
        payload.author_name = profile.display_name;
        const { data, error } = await sb.from('notices').insert(payload).select().single();
        if (error) throw error; saved = data;
      }
      toast('저장되었습니다.', 'success');
      location.href = `./notices.html?id=${saved.id}`;
    } catch (err) {
      msg.textContent = humanError(err); msg.classList.remove('hidden');
    } finally {
      setBusy(btn, false, '');
    }
  });

  // ---------- 라우팅 ----------
  if (mode === 'new') { show('list'); openForm(null); }
  else if (id) { await loadDetail(id); }
  else { show('list'); await loadList(); }
</script>
</body>
</html>
