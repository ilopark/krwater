<div id="mb_login" class="mbskin">
    <div class="mbskin_box">
        <h1>회원가입</h1>
        <div class="mb_log_cate">
            <h2><span class="sound_only">회원</span>가입</h2>
            <a href="login.php.html" class="join">로그인</a>
        </div>
        <form name="fregister" id="fregister" method="post" autocomplete="on">
        
        <fieldset id="login_fs">
            <legend>회원가입</legend>
            <p id="signup-msg" class="app-msg" style="display:none"></p>
            <label for="reg_name" class="sound_only">사용자명</label>
            <input type="text" name="mb_name" id="reg_name" required class="frm_input required app-input" maxLength="30" placeholder="사용자명 (표시 이름)">
            <label for="reg_id" class="sound_only">아이디</label>
            <input type="text" name="mb_id" id="reg_id" required class="frm_input required app-input" maxLength="20" placeholder="아이디 (영문 소문자·숫자 3~20자)" autocomplete="username">
            <label for="reg_pw" class="sound_only">비밀번호</label>
            <input type="password" name="mb_password" id="reg_pw" required class="frm_input required app-input" placeholder="비밀번호 (8자 이상)" autocomplete="new-password">
            <label for="reg_pw2" class="sound_only">비밀번호 확인</label>
            <input type="password" name="mb_password_re" id="reg_pw2" required class="frm_input required app-input" placeholder="비밀번호 확인" autocomplete="new-password">
            <button type="submit" class="btn_submit">회원가입</button>
            <p class="frm_info" style="margin-top:12px;color:#888;font-size:12px;line-height:1.5">가입만으로는 글을 쓸 수 없습니다. 작성 권한(관리자)은 기존 관리자가 부여합니다.</p>
            
            
        </fieldset>
